services:
  easybuy-orders-db:
    image: postgres:16
    platform: linux/arm64
    container_name: easybuy-orders-postgres
    environment:
      POSTGRES_DB: easybuy-orders-db
      POSTGRES_USER: easybuy
      POSTGRES_PASSWORD: easybuy
    ports:
      - "5433:5432"
    volumes:
      - easybuy-orders-data:/var/lib/postgresql/data

volumes:
  easybuy-orders-data: