services:
  easybuy-products-db:
    image: postgres:16
    platform: linux/arm64
    container_name: easybuy-products-postgres
    environment:
      POSTGRES_DB: easybuy-products-db
      POSTGRES_USER: easybuy
      POSTGRES_PASSWORD: easybuy
    ports:
      - "5432:5432"
    volumes:
      - easybuy-products-data:/var/lib/postgresql/data

volumes:
  easybuy-products-data: